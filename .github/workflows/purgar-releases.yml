name: Purgar Releases Antiguas

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # Permiso necesario para borrar releases y tags
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEP_LATEST: 10 # Conservar las 10 releases más recientes

    steps:
      - name: Eliminar releases antiguas y sus tags (sin límite)
        run: |
          echo "Obteniendo la lista completa de todas las releases..."
          TAGS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate | jq -r ".[$KEEP_LATEST:][].tag_name // empty")

          if [ -z "$TAGS" ]; then
            echo "No hay releases antiguas para eliminar (se conservan las $KEEP_LATEST más recientes)."
          else
            echo "Releases antiguas encontradas a eliminar:"
            echo "$TAGS"

            for tag in $TAGS; do
              if [ -n "$tag" ] && [ "$tag" != "null" ]; then
                echo "Eliminando release y tag: $tag"
                gh release delete "$tag" --cleanup-tag --yes || true
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
              fi
            done
            echo "Purga de releases completada."
          fi
